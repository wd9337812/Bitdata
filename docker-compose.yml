services:
  dashboard:
    build: .
    container_name: binance-strategy-dashboard
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
  runner:
    build: .
    container_name: binance-strategy-runner
    restart: unless-stopped
    command: ["python", "-m", "app.runner"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
